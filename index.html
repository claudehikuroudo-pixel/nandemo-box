// 根拠＝Apple HIG Materials・Adopting Liquid Glass（ガラスは操作・ナビの層／文字の多い所は不透明寄りの regular／写真の上は35%の暗い層／スクロール端の効果で読みやすく）
const lgGlass = (a, blur) => ({
  background:`linear-gradient(135deg,rgba(255,255,255,${Math.min(a + 0.18, 0.95)}) 0%,rgba(255,255,255,${a}) 50%,rgba(255,255,255,${Math.min(a + 0.08, 0.95)}) 100%)`,
  backdropFilter:`blur(${blur}px) saturate(190%)`, WebkitBackdropFilter:`blur(${blur}px) saturate(190%)`,
  border:"1px solid rgba(255,255,255,0.55)",
  // 縁の光＝左上の強いハイライト＋右下の弱いハイライト＋内側のにじみ＋下に落ちる影
  boxShadow:"inset 1.5px 1.5px 0 rgba(255,255,255,0.95), inset -1px -1px 0 rgba(255,255,255,0.45), inset 0 0 22px rgba(255,255,255,0.2), 0 16px 34px -18px rgba(50,30,110,0.45), 0 2px 6px rgba(50,30,110,0.06)",
});
const lgClearDark = { background:"rgba(0,0,0,0.35)", backdropFilter:"blur(10px) saturate(160%)", WebkitBackdropFilter:"blur(10px) saturate(160%)", border:"1px solid rgba(255,255,255,0.35)", boxShadow:"inset 1px 1px 0 rgba(255,255,255,0.45), 0 4px 12px rgba(0,0,0,0.22)" };
const lgProminent = { background:"linear-gradient(135deg,rgba(139,84,245,0.9),rgba(107,139,255,0.86))", backdropFilter:"blur(14px) saturate(180%)", WebkitBackdropFilter:"blur(14px) saturate(180%)", border:"1px solid rgba(255,255,255,0.6)", boxShadow:"inset 1.5px 1.5px 0 rgba(255,255,255,0.65), inset -1px -1px 0 rgba(255,255,255,0.25), 0 14px 30px -10px rgba(110,70,230,0.7)" };
// 画面に固定する舞台：空（光の玉）＋上下のスクロール端（下を通る中身をぼかし、浮いた見出し・下タブの文字を読みやすくする）
function lgStage({ sky, orbs, edge }) {
  const st = document.createElement("style");
  st.textContent = `
    .lg-sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:${sky}}
    .lg-sky i{position:absolute;border-radius:50%;filter:blur(48px)}
    .lg-edge{position:fixed;left:0;right:0;max-width:440px;margin:0 auto;pointer-events:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
    .lg-edge.b{bottom:0;height:118px;z-index:999;background:linear-gradient(to top,${edge} 18%,transparent);-webkit-mask-image:linear-gradient(to top,#000 40%,transparent);mask-image:linear-gradient(to top,#000 40%,transparent)}
    .lg-edge.t{top:0;height:96px;z-index:898;background:linear-gradient(to bottom,${edge} 30%,transparent);-webkit-mask-image:linear-gradient(to bottom,#000 50%,transparent);mask-image:linear-gradient(to bottom,#000 50%,transparent)}`;
  document.head.appendChild(st);
  document.body.insertAdjacentHTML("beforeend",
    `<div class="lg-sky" aria-hidden="true">${(orbs || []).map(o => `<i style="${o}"></i>`).join("")}</div><div class="lg-edge t" aria-hidden="true"></div><div class="lg-edge b" aria-hidden="true"></div>`);
}
{
  // E案 ガラス全開（Bの強化版）：空を鮮やかに・縁の光・ぼかし強め・見出しと下タブが浮く・カードは自分の写真が透けるガラス。
  // Bの弱点を潰す＝補足文字・値段チップ・種類ピルを濃く／下タブは不透明寄り（HIGの regular）＋スクロール端の効果＋文字を濃く
  lgStage({
    sky:"linear-gradient(165deg,#FFD6C2 0%,#F6D3F0 42%,#D2E2FF 72%,#C8F0F4 100%)",
    orbs:[
      "width:min(80vw,420px);height:min(80vw,420px);left:-24vw;top:-14vw;background:#FF9A62;opacity:.9",
      "width:min(60vw,320px);height:min(60vw,320px);right:-16vw;top:6vh;background:#FF6FB0;opacity:.6",
      "width:min(72vw,400px);height:min(72vw,400px);right:-22vw;top:40vh;background:#9B6BFF;opacity:.75",
      "width:min(86vw,460px);height:min(86vw,460px);left:-20vw;bottom:-24vw;background:#38D0EA;opacity:.8",
    ],
    edge:"rgba(244,232,248,0.8)",
  });
  // 種類の文字色を濃く（Bではガラスの上で薄く見えた）
  const DEEP = { event:"#C62A58", task:"#6A3FD6", mono:"#9A5D00", basho:"#127A44", joho:"#0E6AA8", recipe:"#B8322A", news:"#3B4658", kyomi:"#9C1FB0", money:"#7A5A0E" };
  for (const k of Object.keys(DEEP)) if (CATS[k]) CATS[k].chipC = DEEP[k];
  const PILL = { boxShadow:"inset 0 0 0 40px rgba(255,255,255,0.55), 0 1px 3px rgba(40,30,80,0.1)", border:"1px solid rgba(255,255,255,0.9)" };
  const BTN = { boxShadow:"inset 0 0 0 60px rgba(255,255,255,0.5), inset 1px 1px 0 rgba(255,255,255,0.9), 0 2px 6px rgba(40,30,80,0.08)", border:"1px solid rgba(255,255,255,0.85)" };
  Object.assign(S, {
    phone: { ...S.phone, background:"transparent", overflow:"visible", overflowX:"clip" },
    hd: { ...S.hd, position:"sticky", top:0, zIndex:900, paddingTop:10 },
    gear: { ...lgGlass(0.5, 18), width:38, height:38, borderRadius:19, display:"flex", alignItems:"center", justifyContent:"center", fontSize:17, color:"#2A2540", cursor:"pointer", lineHeight:1 },
    tagline: { ...S.tagline, color:"#6E5AA8" },
    cal: { ...S.cal, ...lgGlass(0.3, 26), borderRadius:28 },
    calNavBtn: { ...S.calNavBtn, background:"rgba(255,255,255,0.55)", boxShadow:"inset 1px 1px 0 #fff", color:"#2A2540" },
    dayNumMini: { ...S.dayNumMini, color:"#221E36" },
    wkCard: { ...S.wkCard, ...lgGlass(0.3, 22), background:"linear-gradient(135deg,rgba(220,255,236,0.62),rgba(255,255,255,0.3))" },
    wkGo: { ...S.wkGo, ...PILL, color:"#127A44" },
    taskSec: { ...S.taskSec, ...lgGlass(0.32, 24) },
    taskSecHead: { ...S.taskSecHead, background:"rgba(255,255,255,0.45)", boxShadow:"inset 1px 1px 0 rgba(255,255,255,0.9)" },
    askBar: { ...S.askBar, ...lgGlass(0.42, 22), borderRadius:99, padding:"13px 16px" },
    askBarText: { ...S.askBarText, color:"#5B2FD0" },
    sortWrap: { ...S.sortWrap, ...lgGlass(0.3, 16), padding:3 },
    sortBtn: { ...S.sortBtn, color:"#4A4566" },
    sortBtnOn: { ...S.sortBtnOn, background:"rgba(255,255,255,0.92)", boxShadow:"inset 1px 1px 0 #fff, 0 2px 8px rgba(60,40,120,0.18)" },
    tab: { ...S.tab, background:"rgba(255,255,255,0.5)", border:"1px solid rgba(255,255,255,0.8)", boxShadow:"inset 1px 1px 0 rgba(255,255,255,0.95), 0 4px 12px -6px rgba(60,40,120,0.3)" },
    tabLbl: { ...S.tabLbl, color:"#3D3858", fontWeight:700 },
    // カード＝ガラス＋地に自分の写真のぼかし（Apple Music の再生画面の考え方）。写真は内側に少し下げて縁の光を見せる
    card: { ...S.card, ...lgGlass(0.24, 20), borderRadius:24 },
    cardTintWrap: { position:"absolute", inset:0, overflow:"hidden", borderRadius:"inherit", zIndex:0, pointerEvents:"none" },
    cardTint: { position:"absolute", left:"-20%", top:"-20%", width:"140%", height:"140%", objectFit:"cover", filter:"blur(28px) saturate(180%)", opacity:0.5, pointerEvents:"none" },
    dBar: { ...S.dBar, width:0 },
    dCol: { ...S.dCol, position:"relative", zIndex:1 },
    hero: { ...S.hero, margin:"6px 6px 0", borderRadius:18 },
    cardBody: { ...S.cardBody, background:"rgba(255,255,255,0.4)", marginTop:6 },
    cardTitle: { ...S.cardTitle, color:"#17132B" },
    cardMeta: { ...S.cardMeta, color:"#3F3A5A", fontWeight:600 },
    cardDate: { ...S.cardDate, color:"#4A4566" },
    cardChip: { ...S.cardChip, ...PILL, fontWeight:800 },
    cardCatPill: { ...S.cardCatPill, ...PILL },
    cardFoot: { ...S.cardFoot, borderTop:"1px solid rgba(255,255,255,0.6)" },
    cardIngBtn: { ...S.cardIngBtn, ...BTN, color:"#B8322A" },
    cardSearchBtn: { ...S.cardSearchBtn, ...BTN, color:"#0E6AA8" },
    cardMapBtn: { ...S.cardMapBtn, ...BTN, color:"#127A44" },
    cardLink: { ...S.cardLink, ...BTN, color:"#0E6AA8" },
    cardMenuBtn: { ...S.cardMenuBtn, ...lgClearDark },
    expandBadge: { ...S.expandBadge, ...lgClearDark },
    catCard: { ...S.catCard, ...lgGlass(0.4, 20) },
    navBar: { ...S.navBar, ...lgGlass(0.62, 30), left:12, right:12, bottom:"calc(12px + env(safe-area-inset-bottom))", height:66, borderRadius:33, paddingBottom:0 },
    navItem: { ...S.navItem, color:"#3A3554", margin:"6px 4px", borderRadius:27 },
    navItemOn: { color:"#fff", background:"linear-gradient(135deg,rgba(122,66,236,0.96),rgba(88,116,248,0.93))", boxShadow:"inset 1.5px 1.5px 0 rgba(255,255,255,0.55), inset -1px -1px 0 rgba(255,255,255,0.2), 0 6px 16px -4px rgba(110,70,230,0.55)" },
    fabDock: { ...S.fabDock, bottom:"calc(90px + env(safe-area-inset-bottom))", marginBottom:0 },
    navFab: { ...S.navFab, ...lgProminent },
    sheet: { ...S.sheet, ...lgGlass(0.8, 30), background:"rgba(250,248,255,0.88)", borderRadius:"32px 32px 0 0" },
  });
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
