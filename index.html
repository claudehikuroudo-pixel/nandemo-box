// 既定の種類（並び順もこれ）。利用者が作ったタブはこの後ろに並ぶ

const CUSTOM_PAL = [

];
const EMPTY_CAT_CONF = { labels: {}, custom: [] };
// 外から来た設定（書き出しファイル等）を安全な形に直す
function cleanCatConf(c) {
  const labels = {}, custom = [], seen = new Set();
  if (c && c.labels && typeof c.labels === "object")
    for (const k of BASE_CAT_KEYS) { const v = String(c.labels[k] || "").trim().slice(0, 12); if (v) labels[k] = v; }
  if (c && Array.isArray(c.custom))

      seen.add(key); custom.push({ key, label, pal: Math.abs(Number(t.pal) || 0) % CUSTOM_PAL.length });

function applyCatConf(conf) {

const catOf = k => CATS[k] || CATS.joho; // 知らない種類（消したタブ等）でも画面が落ちないように

// ── 家計簿 ──

const HIMOKU = ["食費", "外食", "日用品", "交通", "衣服", "美容", "趣味・娯楽", "交際費", "医療", "教育", "住まい", "通信", "その他"];
const fmtYen = n => "¥" + Math.round(Number(n) || 0).toLocaleString("ja-JP");
// 「¥1,280」「1280円」「１２８０」などを数字に。読めなければ 0
function parseAmount(v) {

}
const isMoney = it => it && it.category === "money";

// ── 初期サンプル（初回だけ表示。一度使い始めると保存内容に置き換わる）──

function extractUrl(text) {

// ── YouTube ──
// 動画ページ本体は microlink(無料枠＝antibotで失敗)・Jina(YouTubeを一時ブロック)とも読めず「内容不明」になっていた（2026-10-18実測）。
// 公式oEmbed(題名・チャンネル)とサムネ画像(i.ytimg.com)はCORS許可＝ブラウザから直接読めるので、そこから中身を割り出す。
function ytIdOf(url) {
  try {
    const u = new URL(url);
    const h = u.hostname.replace(/^(www|m|music)\./, "");
    let id = null;
    if (h === "youtu.be") id = u.pathname.split("/")[1];
    else if (h === "youtube.com" || h === "youtube-nocookie.com") {
      id = u.searchParams.get("v");
      if (!id) { const m = u.pathname.match(/^\/(shorts|live|embed|v)\/([\w-]{11})/); if (m) id = m[2]; }
    }
    return id && /^[\w-]{11}$/.test(id) ? id : null;
  } catch (e) { return null; }
}
const ytThumb = (id, name) => `https://i.ytimg.com/vi/${id}/${name}.jpg`;
// カードのYouTube動画ID（この機能より前に入れたカードはytを持たないのでURLから割り出す）
const ytOf = it => (it && (it.yt || (it.sourceUrl && !it.searchLabel ? ytIdOf(it.sourceUrl) : null))) || null;
// 高画質(maxres)が無い動画は404になるので、読めなければ16:9の中画質(mq)へ落とす
const YT_FRAME_FALLBACK = { maxresdefault: "mqdefault", maxres1: "mq1", maxres2: "mq2", maxres3: "mq3" };
function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject; r.readAsDataURL(blob); });
}

// ── 材料を「元データ」から読む（AIの読み取り・推定より正確）──
// ①レシピサイト：ページに埋め込まれたレシピ情報（schema.org Recipe の recipeIngredient）＝書いてあるとおりの材料。
//   Jina Reader の html モードは <script type="application/ld+json"> を残す（クックパッドで実測 2026-10-18）。AIもキーも要らない。
// ②YouTube：概要欄。動画ページはブラウザから読めない（CORS・Jinaは一時ブロック）ので、公式の YouTube Data API v3（videos.list＝1回1単位・
//   既定は1日10,000単位 https://developers.google.com/youtube/v3/determine_quota_cost ）をユーザー自身のキーで読む（任意設定）。
const LS_YTKEY = "nb_ytkey";
const decodeEnt = s => String(s || "").replace(/&amp;/g, "&").replace(/&quot;/g, '"').replace(/&#0?39;|&apos;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&nbsp;/g, " ");
function findRecipeLd(o, depth = 0) {
  if (!o || depth > 6) return null;
  if (Array.isArray(o)) { for (const v of o) { const r = findRecipeLd(v, depth + 1); if (r) return r; } return null; }
  if (typeof o !== "object") return null;
  const t = o["@type"];
  if ((t === "Recipe" || (Array.isArray(t) && t.includes("Recipe"))) && Array.isArray(o.recipeIngredient)) return o;
  for (const v of Object.values(o)) { if (v && typeof v === "object") { const r = findRecipeLd(v, depth + 1); if (r) return r; } }
  return null;
}
function recipeFromHtml(html) {
  const re = /<script[^>]*application\/ld\+json[^>]*>([\s\S]*?)<\/script>/gi;
  let m;
  while ((m = re.exec(String(html || "")))) {
    let j; try { j = JSON.parse(m[1].trim()); } catch (e) { continue; }
    const r = findRecipeLd(j);
    if (!r) continue;
    const ingredients = normIngredients(r.recipeIngredient.map(x => splitIngLine(decodeEnt(x))));
    if (!ingredients.length) continue;
    const y = Array.isArray(r.recipeYield) ? r.recipeYield.find(v => typeof v === "string") || r.recipeYield[0] : r.recipeYield;
    return { name: decodeEnt(r.name).slice(0, 60), ingredients, servings: y ? decodeEnt(y).slice(0, 20) : "" };
  }
  return null;
}
async function fetchRecipeData(url) {
  if (!url) return null;
  try {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 9000);
    const res = await fetch(`https://r.jina.ai/${url}`, { headers: { "X-Return-Format": "html" }, signal: ctrl.signal });
    clearTimeout(to);
    if (!res.ok) return null;
    return recipeFromHtml(await res.text());
  } catch (e) { return null; }
}
// 失敗は理由つきで返す（呼び出し側が画面に出す）
async function fetchYtDesc(id, key) {
  try {
    const r = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${id}&key=${encodeURIComponent(key)}`);
    const d = await r.json().catch(() => ({}));
    if (!r.ok || d.error) {
      const e = d.error || {};
      const why = [(e.errors && e.errors[0] && e.errors[0].reason) || "", e.status || "", e.message || ""].join(" ");
      return { error: /quotaExceeded|dailyLimit/i.test(why) ? "今日の読み取り上限に達しました（明日また読めます）"
        : /keyInvalid|API_KEY_INVALID|API key not valid/i.test(why) ? "YouTubeのキーが正しくありません（⚙で確かめてください）"
        : /Referer|referrer|SERVICE_DISABLED|accessNotConfigured|PERMISSION_DENIED|forbidden/i.test(why) ? "YouTubeのキーの設定を確かめてください（YouTube Data API v3 の有効化・使えるサイトの指定）"
        : "概要欄を読めませんでした" + (e.message ? `（${String(e.message).slice(0, 80)}）` : "") };
    }
    const s = d.items && d.items[0] && d.items[0].snippet;
    if (!s) return { error: "動画が見つかりませんでした（非公開・削除の可能性）" };
    return { description: s.description || "", title: s.title || "", channel: s.channelTitle || "" };
  } catch (e) { return { error: "通信できず、概要欄を読めませんでした" }; }
}
// 概要欄に貼られた「レシピはこちら」のリンク（SNS・通販・動画は除く）。材料がリンク先にしか無い動画用
function recipeLinksIn(text) {
  const skip = /(^|\.)(youtube\.com|youtu\.be|instagram\.com|x\.com|twitter\.com|tiktok\.com|facebook\.com|threads\.net|line\.me|lin\.ee|amazon\.co\.jp|amazon\.com|amzn\.to|amzn\.asia|rakuten\.co\.jp|a\.r10\.to|airbnb\.jp|airbnb\.com)$/i;
  const out = [];
  for (const raw of String(text || "").match(/https?:\/\/[^\s<>"'）」】]+/g) || []) {
    const u = raw.replace(/[.,)\]]+$/, "");
    try { if (skip.test(new URL(u).hostname)) continue; } catch (e) { continue; }
    if (!out.includes(u)) out.push(u);
    if (out.length >= 3) break;
  }
  return out;
}
async function recipeFromLinks(text) {
  const links = recipeLinksIn(text);
  if (!links.length) return null;
  const found = await Promise.all(links.map(u => fetchRecipeData(u).then(r => r ? { ...r, url: u } : null)));
  return found.find(Boolean) || null;
}

// カードに出す写真＝自分で差し替えた写真(cover) > 放り込んだ写真 > URL先のサムネ。cover:"none"＝写真なしにした

const ING_SRC = {

// AIが返した材料を {name, qty} にそろえる（空・重複を捨て、上限40）
function normIngredients(arr) {
  if (!Array.isArray(arr)) return [];
  const seen = new Set(), out = [];
  for (const x of arr) {
    const isStr = typeof x === "string";
    const name = String((isStr ? x : x && x.name) || "").trim().slice(0, 40);
    if (!name) continue;
    const qty = String((!isStr && x && x.qty) || "").trim().slice(0, 30);
    const key = name + "|" + qty;
    if (seen.has(key)) continue;
    seen.add(key); out.push({ name, qty });
    if (out.length >= 40) break;
  }

}

function ingKey(name) {

// 「卵 (Mサイズ)」→ { base:"卵", note:"Mサイズ" }

  const m = n.match(/\(([^)]*)\)/);
  return { base: n.replace(/\([^)]*\)/g, "").trim() || n.trim(), note: m ? m[1].trim() : "" };
}

  const to = toDateStr(end);

// 複数レシピの材料を1つの買い物リストに。分量は勝手に合算せず「200g＋150g」と並べる（単位がばらばらで合算は事故のもと）
function buildShopRows(recipes) {
  const map = new Map(), rows = [];
  for (const r of recipes) {
    (r.ingredients || []).forEach((g, idx) => {
      const key = ingKey(g.name);
      if (!key) return;
      const { base, note } = ingParts(g.name);
      let row = map.get(key);
      if (!row) { row = { key, name: base, parts: [], refs: [], guess: false, titles: [] }; map.set(key, row); rows.push(row); }
      const part = [g.qty, note && `(${note})`].filter(Boolean).join(" ");
      if (part) row.parts.push(part);
      row.refs.push({ id: r.id, idx });
      if (r.ingSrc === "guess") row.guess = true;
      if (!row.titles.includes(r.title)) row.titles.push(r.title);

  const haveOf = (row) => row.refs.every(ref => { const r = recipes.find(x => x.id === ref.id); return r && r.ingredients[ref.idx] && r.ingredients[ref.idx].have; });

// 既定(600px・画質0.45)は保存用。材料表のような小さい文字を読ませる時は大きめ・高画質で呼ぶ
function compressImage(dataUrl, maxW = 600, quality = 0.45) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
    img.onerror = () => resolve(dataUrl);
  });
}

function parseBackup(text) {

async function applyBackup(bk, mode, current) {
  const have = new Set(current.map(it => it.id));
  const incoming = mode === "add" ? bk.items.filter(it => !have.has(it.id)) : bk.items;
  // 添付ファイルは新しい鍵で入れる（この端末の別の添付と鍵がぶつかって上書きしないように）
  const rename = {}, stamp = Date.now();
  let n = 0, lost = 0;
  incoming.forEach(it => (it.attachments || []).forEach(a => { if (isBlobAtt(a) && !bk.files[a.bid]) lost++; }));
  for (const k of blobKeysOf(incoming)) {
    if (!bk.files[k]) continue;
    const nk = `att:r${stamp}-${n++}`;
    await idbPutAtt(nk, bk.files[k]);
    rename[k] = nk;
  }
  const moved = incoming.map(it => !it.attachments ? it
    : { ...it, attachments: it.attachments.map(a => isBlobAtt(a) && rename[a.bid] ? { ...a, bid: rename[a.bid] } : a) });
  const idNum = it => typeof it.id === "number" ? it.id : 0;
  const next = mode === "add" ? [...current, ...moved].sort((a, b) => idNum(b) - idNum(a)) : moved;
  await idbSetItems(next);                              // 書けなかったら投げる＝今の箱はそのまま

    const keep = blobKeysOf(next);
    for (const k of blobKeysOf(current)) if (!keep.has(k)) await idbDelAtt(k);
  }
  return { next, added: moved.length, skipped: bk.items.length - incoming.length, files: n, lost };

      if (detail) {
        if (it.meta) parts.push(clip(it.meta, 80));
        if (it.chip) parts.push(clip(it.chip, 24));
        if (it.place && it.place !== it.meta) parts.push("場所:" + clip(it.place, 40));
      }
      if (it.date) parts.push("日付" + md(it.date) + (detail && it.time ? " " + it.time : ""));
      if (it.done) parts.push("済");
      if (detail && it.added) parts.push("保存" + md(it.added));
      lines.push(parts.join("｜"));
    });
  });
  const detailed = detailIds ? detailIds.size : pool.length;
  const scopeNote = preset
    ? `\n- 質問に関係する種類（${preset.cats.map(c => CATS[c] ? CATS[c].label : c).join("・")}）だけを送っています。`
    : detailIds ? `\n- 箱が大きいので、全${pool.length}枚の題名を送り、質問に関係しそうな${detailed}枚だけ詳しい項目を付けています。題名だけの行も根拠にしてよい。` : "";
  const wd = "日月火水木金土"[now.getDay()];
  const prompt = `あなたはユーザー個人の「デテコイ」（気になったものを放り込む箱）に詳しいアシスタントです。
下の[箱の中身]だけを根拠に、ユーザーの質問へ日本語で簡潔に答えてください。
- 各行＝「番号 題名｜補足｜ラベル｜場所｜日付（予定日・期限・作る日）｜済（完了）｜保存日」。無い項目は省いている。[ ]は種類。
- 該当する項目があれば、その題名を挙げて答える（複数あれば箇条書き）。
- 見当たらなければanswerで「箱の中には見当たりませんでした」と正直に言い、idsは空配列。
- 一覧に無い情報を作らない（ハレーション厳禁）。idsは必ず一覧にある番号だけ。
- 今日は${todayStr}（${wd}）。「今週」等の相対表現は今日基準で判断する。
- 提案系の質問（今晩なに作る?等）は、該当する項目から1〜3個おすすめして理由を一言。${scopeNote}

[箱の中身]
${lines.join("\n")}

質問: ${question}

以下のJSON形式だけを返してください。前置き・コードブロック不要:
{"answer":"日本語の答え（簡潔・改行可）","ids":[該当する項目の番号の配列（関連が強い順・最大5個・無ければ空）]}`;
  return { prompt, idxToId, total: (items || []).length, pool: pool.length, detailed, filtered: !!preset || !!detailIds };
}

// ── スキャン演出（AI解析のシグネチャー体験・C型＝輪郭トレース） ──
// C＝輪郭トレース：被写体のフチを光の帯がなぞる＝「AIが中身を認識してる」を絵にする（このアプリの核）。
//    ＋薄いレーザーが上から下に掃引して"読んでる"感を足す。
// loop=true：解析中ずっと繰り返す（時間可変のAPI待ち向け）／loop=false：一回で締める（カードの画像検索）
function ScanFX({ loop }) {
  const rep      = loop ? "infinite" : "forwards";
  const traceDur = loop ? "2.3s"     : "0.9s";
  const beam     = loop ? "nbScan 1.7s linear infinite" : "nbScan 0.9s cubic-bezier(0.45,0,0.5,1) forwards";
  return (
    <div style={S.scanOverlay}>
      {/* C：輪郭トレース（薄い枠＋フチを走る光の帯） */}
      <svg style={S.scanTraceSvg} viewBox="0 0 100 100" preserveAspectRatio="none">
        <rect x="2" y="2" width="96" height="96" rx="7" vectorEffect="non-scaling-stroke" style={S.scanTraceBase}/>
        <rect x="2" y="2" width="96" height="96" rx="7" vectorEffect="non-scaling-stroke"
              style={{...S.scanTraceLit, animation:`nbTraceMove ${traceDur} linear ${rep}`}}/>
      </svg>
      {/* 薄いレーザー掃引 */}
      <div style={{...S.scanLine, opacity:0.7, animation:beam}}/>
      {!loop && <div style={S.scanRipple}/>}
    </div>
  );
}

// ── 地図（自分だけの地図）。Leaflet＋OpenStreetMap＝APIキー/課金不要・完全無料。 ──
// Leafletの既定マーカー画像パスをCDNへ明示（自動検出が外れてピンが消えるのを防ぐ）。
if (window.L && window.L.Icon) {
  delete window.L.Icon.Default.prototype._getIconUrl;
  window.L.Icon.Default.mergeOptions({
    iconRetinaUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png",
    iconUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png",
    shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
  });

const GEO_CACHE_KEY = "nb_geocache_v1";
function loadGeoCache(){ try { return JSON.parse(localStorage.getItem(GEO_CACHE_KEY) || "{}"); } catch(e){ return {}; } }
function saveGeoCache(c){ try { localStorage.setItem(GEO_CACHE_KEY, JSON.stringify(c)); } catch(e){} }
function escHtml(s){ return String(s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
// カテゴリ色のティアドロップ型ピン（予定=ピンク／行ってみたい=緑…でひと目で分かる）
function pinIcon(color){
  return window.L.divIcon({
    className: "nb-pin",
    html: `<div style="width:20px;height:20px;border-radius:50% 50% 50% 0;background:${color};transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.4)"></div>`,
    iconSize: [20,20], iconAnchor: [10,20], popupAnchor: [0,-18]
  });
}
// 地名→座標（OSM Nominatim・無料）。利用規約に沿って呼び出しは1件ずつ間隔を空ける（呼び出し側で制御）。
async function geocodeNominatim(q){
  const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ja&q=${encodeURIComponent(q)}`, { headers: { "Accept": "application/json" } });
  if (!r.ok) throw new Error("geocode failed");
  const arr = await r.json();
  if (Array.isArray(arr) && arr.length) return { lat: parseFloat(arr[0].lat), lng: parseFloat(arr[0].lon) };
  return null;
}

// 地名検索クエリを「ヒットしやすい順」に組み立てる。タイトル1発だと固有店名や感想まじりの名前で
// 空振りするので、meta欄の地名（例「渋谷・徒歩5分」→「渋谷」）と組み合わせた候補も投げる。
function buildGeoQueries(it){
  const cand = [];
  const push = (s) => { s = (s||"").replace(/\s+/g," ").trim(); if (s && !cand.includes(s)) cand.push(s); };
  const title = (it.title||"").trim();
  const place = (it.place||"").trim();
  // 感想・接頭を軽く落とす（「気になる角打ちバー」→「角打ちバー」）
  const cleanTitle = title.replace(/^(気になる|話題の|噂の|例の|あの|行きたい|注目の)/,"").trim();
  // meta から地名っぽいトークンだけ拾う（時間/距離/期間などのノイズは除外）
  const metaTokens = (it.meta||"").split(/[・,/｜|\s]+/).map(s=>s.trim()).filter(s =>
    s && !/^\d/.test(s) && !/(分|駅|徒歩|以内|期間|限定|オンライン|あとで|今週|今日|明日|km|ｍ|m)$/.test(s)
  );
  if (place) push(place);                                  // 会場・店名が明示されていれば最優先
  metaTokens.forEach(t => push(`${t} ${cleanTitle}`));     // 「渋谷 角打ちバー」
  push(cleanTitle);                                        // 「角打ちバー」
  push(title);                                             // 素のタイトル
  metaTokens.forEach(t => push(t));                        // 最後の砦＝地名だけ（「渋谷」）
  return cand.slice(0, 4);                                 // 投げすぎない（レート制限＆礼儀）
}

function BoxMap({ items, onPlan, onFixLocation }) {
  const boxRef = useRef(null);    // 地図コンテナ
  const mapRef = useRef(null);    // Leaflet map本体
  const layerRef = useRef(null);  // マーカー層
  const [pts, setPts] = useState([]);      // 解決済み {it,lat,lng}
  const [failed, setFailed] = useState([]);// 座標にできなかった「行ってみたい」＝消さずに出す
  const [loading, setLoading] = useState(false);

  // ① 座標を解決：手動ピン→撮った場所(geo)→「行ってみたい/会場つき予定」は地名を複数候補でジオコーディング。
  //    取れなかったものは無言で捨てず failed に貯めて画面に出す（＝ユーザーが自分で直せる）。
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const cache = loadGeoCache();
      const isHit = (v) => v && typeof v.lat === "number";
      const out = [];
      const need = [];               // {it, queries}
      for (const it of (items || [])) {
        if (it.mapPin && typeof it.mapPin.lat === "number") {          // 手動で置いたピン（最優先）
          out.push({ it, lat: it.mapPin.lat, lng: it.mapPin.lng });
        } else if (it.geo && typeof it.geo.lat === "number" && typeof it.geo.lng === "number") {
          out.push({ it, lat: it.geo.lat, lng: it.geo.lng });          // 撮った場所つき写真
        } else if (it.category === "basho" || (it.category === "event" && it.place)) {
          const queries = buildGeoQueries(it);
          if (!queries.length) continue;
          const cachedHit = queries.map(q => cache[q]).find(isHit);    // どれか1つでもキャッシュ済みなら使う
          if (cachedHit) out.push({ it, lat: cachedHit.lat, lng: cachedHit.lng });
          else need.push({ it, queries });
        }
      }
      if (!cancelled) { setPts(out.slice()); setFailed([]); }
      if (need.length) {
        setLoading(true);
        const fails = [];
        for (const g of need) {
          if (cancelled) break;
          let found = null;
          for (const q of g.queries) {
            if (cancelled) break;
            const cached = cache[q];
            if (isHit(cached)) { found = cached; break; }               // 既知ヒット
            if (cached && cached.miss) continue;                        // 既知の空振り→次の候補へ
            try {
              const c = await geocodeNominatim(q);
              await new Promise(r => setTimeout(r, 1100));               // Nominatim 1req/s 遵守
              if (c) { cache[q] = c; found = c; break; }
              cache[q] = { miss: true };                                // 空振りも記録＝同じ検索を繰り返さない
            } catch (e) { /* この候補は諦めて次へ */ }
          }
          if (isHit(found)) { out.push({ it: g.it, lat: found.lat, lng: found.lng }); if (!cancelled) setPts(out.slice()); }
          else { fails.push(g.it); if (!cancelled) setFailed(fails.slice()); }
        }
        saveGeoCache(cache);
        if (!cancelled) setLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, [items]);

  // 「出せなかった場所」を手動で解決：正しい地名を入れてもらい、取れたら mapPin として保存（＝itemsに乗る→永続化＆再描画）
  async function fixLocation(it){
    const q = window.prompt("正しい地名・住所を入れてください（例：渋谷 恵比寿横丁）", it.title || "");
    if (!q || !q.trim()) return;
    const query = q.trim();
    try {
      setLoading(true);
      const c = await geocodeNominatim(query);
      setLoading(false);
      if (c && onFixLocation) {
        const cache = loadGeoCache(); cache[query] = c; saveGeoCache(cache);
        onFixLocation(it.id, c);   // items更新→再解決でピン化し、failedからも自動で消える
      } else {
        window.alert("その名前でも場所が見つかりませんでした。もう少し詳しい地名や住所でお試しください。");
      }
    } catch (e) { setLoading(false); window.alert("場所の検索に失敗しました。通信環境をご確認ください。"); }
  }

  // ② 地図を一度だけ生成
  useEffect(() => {
    if (!boxRef.current || mapRef.current || !window.L) return;
    const map = window.L.map(boxRef.current, { zoomControl: true });
    window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(map);
    map.setView([35.681, 139.767], 11); // 既定＝東京
    layerRef.current = window.L.layerGroup().addTo(map);
    mapRef.current = map;
    setTimeout(() => map.invalidateSize(), 120);
    return () => { map.remove(); mapRef.current = null; layerRef.current = null; };
  }, []);

  // ③ pts変化でマーカー再描画＋範囲フィット
  useEffect(() => {
    const map = mapRef.current, layer = layerRef.current;
    if (!map || !layer || !window.L) return;
    layer.clearLayers();
    if (!pts.length) return;
    const bounds = [];
    for (const p of pts) {
      const c = CATS[p.it.category] || {};
      const color = c.dot || "#2fd87a";
      const gmap = `https://www.google.com/maps?q=${p.lat},${p.lng}`;
      const el = document.createElement("div");
      el.style.minWidth = "150px";
      el.innerHTML =
        `<b style="font-size:13px">${escHtml(p.it.title)}</b>` +
        `<div style="color:#8a8a96;font-size:11px;margin-top:2px">${escHtml(c.label||"")}${p.it.place ? " ・ 📍"+escHtml(p.it.place) : ""}</div>` +
        `<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">` +
          `<a href="${gmap}" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:#2b6cb0;text-decoration:none">Googleマップで開く</a>` +
          (p.it.category !== "event" ? `<button class="nb-plan" style="font-size:12px;font-weight:700;border:none;background:#16161e;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer">📅 予定に入れる</button>` : "") +
        `</div>`;
      const btn = el.querySelector(".nb-plan");
      if (btn && onPlan) btn.addEventListener("click", () => { onPlan(p.it); map.closePopup(); });
      window.L.marker([p.lat, p.lng], { icon: pinIcon(color) }).bindPopup(el).addTo(layer);
      bounds.push([p.lat, p.lng]);
    }
    if (bounds.length === 1) map.setView(bounds[0], 14);
    else map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
    setTimeout(() => map.invalidateSize(), 60);
  }, [pts]);

  return (
    <div style={{ position: "relative", padding: "0 16px 150px" }}>
      <div ref={boxRef} style={S.mapBox} />
      {loading && <div style={S.mapLoading}>📍 場所を地図に配置中…</div>}
      {pts.length === 0 && failed.length === 0 && !loading && (
        <div style={S.mapEmpty}>
          <div style={S.mapEmptyEmoji}>🗺️</div>
          <div style={S.mapEmptyTitle}>行きたい場所が、地図に貯まる</div>
          <div style={S.mapEmptyText}>「行ってみたい」お店やスポットを放り込むと、ここに常時ピンで表示されます。撮った場所つきの写真も出ます。</div>
        </div>
      )}
      {failed.length > 0 && (
        <div style={S.mapFailWrap}>
          <div style={S.mapFailHead}>📍 地図に出せなかった場所（{failed.length}）</div>
          <div style={S.mapFailNote}>名前だけだと場所を特定できないことがあります。地名を足すとピンが立ちます。</div>
          {failed.map(it => (
            <div key={it.id} style={S.mapFailRow}>
              <div style={S.mapFailTitle}>{it.title}</div>
              <div style={S.mapFailBtns}>
                <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(it.title||"")}`} target="_blank" rel="noopener noreferrer" style={S.mapFailLink}>Googleマップで探す</a>
                <button style={S.mapFailFix} onClick={()=>fixLocation(it)}>地名を指定</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

  // 緯度経度→地名（BigDataCloud・無料/キー不要/CORS/日本語）
  async function reverseGeocode(lat, lng) {
    try {
      const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=ja`);
      const d = await r.json();
      // 日本では locality=市区町村(港区/鶴見区)が最も分かりやすい。city は都道府県が返ることがある
      return d.locality || d.city || d.principalSubdivision || d.countryName || "";
    } catch (e) { return ""; }
  }

  // 📷 撮る（直行カメラ）→ 撮影時の現在地も取得 → シートを開いてAI仕分けへ
  async function pickCamera(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    pendingGeoRef.current = null; setPendingPlace("");
    // 位置情報を並行取得（許可制。取れなくても写真は入る）
    if (navigator.geolocation) {
      setPendingPlace("📍 場所を取得中…");
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        const place = await reverseGeocode(lat, lng);
        pendingGeoRef.current = { lat, lng, place };
        setPendingPlace(place ? ("📍 " + place) : "📍 現在地を記録");
      }, () => { pendingGeoRef.current = null; setPendingPlace(""); }, { enableHighAccuracy: true, timeout: 8000 });
    }
    const reader = new FileReader();
    reader.onload = async () => {
      const compressed = await compressImage(reader.result);
      setImage(compressed);
      setSheet(true);
    };
    reader.readAsDataURL(file);
    e.target.value = ""; // 同じ端末で連続撮影できるようリセット
  }

  async function fetchUrlMeta(url) {
    try {
      const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}&timeout=5000`);
      const data = await res.json();
      if (data.status === "success") {
        return {
          title: data.data.title || "",
          description: data.data.description || "",
          image: data.data.image?.url || "",
          publisher: data.data.publisher || "",
        };
      }
    } catch (e) {}
    return null;
  }

  // URLのページ本文そのものを読む（＝メタだけでなく中身で分類する）。
  // Jina Reader(r.jina.ai)は任意ページを整形テキストで返し、CORSも許可（ブラウザから直接叩ける）。
  // 読めない時（ログイン必須・SPA・SNS投稿・レート制限・タイムアウト）は null → メタ+ドメインにフォールバック。
  async function fetchPageText(url) {
    try {
      const ctrl = new AbortController();
      const to = setTimeout(() => ctrl.abort(), 8000);
      const res = await fetch(`https://r.jina.ai/${url}`, {
        headers: { "X-Return-Format": "text" },
        signal: ctrl.signal,
      });
      clearTimeout(to);
      if (!res.ok) return null;
      let t = (await res.text()).trim();
      if (!t) return null;
      // 分類に必要な冒頭だけ使う（トークン節約）。ナビ等のノイズは冒頭に混じるが本文が続く。
      return t.slice(0, 6000); // レシピサイトは材料表が本文の中ほどにあるので3500では切れることがあった
    } catch (e) { return null; }
  }

  // YouTube：公式oEmbedで題名・チャンネル、AIに見せるサムネ画像を取る。取れなかった物は空のまま返す（呼び出し側が画面に出す）
  async function fetchYouTube(id) {
    let meta = null, thumbData = "";
    try {
      const r = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent("https://www.youtube.com/watch?v=" + id)}&format=json`);
      if (r.ok) { const d = await r.json(); meta = { title: d.title || "", author: d.author_name || "" }; }
    } catch (e) {}
    try {
      const r = await fetch(ytThumb(id, "hqdefault"));
      if (r.ok) thumbData = await blobToDataUrl(await r.blob());
    } catch (e) {}
    return { meta, thumbData };
  }
  // カードに出すサムネ：高画質(maxres)があればそれ、無ければ16:9の中画質
  function ytCardThumb(id) {

      im.onload = () => resolve(ytThumb(id, im.naturalWidth > 200 ? "maxresdefault" : "mqdefault"));
      im.onerror = () => resolve(ytThumb(id, "mqdefault"));
      im.src = ytThumb(id, "maxresdefault");
    });
  }

  async function analyze(text, img) {
    if (!apiKey) { setError("先に右上の⚙からAPIキーを設定してください。"); return; }
    setBusy(true); setError(""); setResult(null);
    try {
      const sourceUrl = extractUrl(text);
      const ytId = sourceUrl ? ytIdOf(sourceUrl) : null;
      let urlMeta = null, pageText = null, yt = null, ytDesc = null, recipeLd = null;
      const notes = []; // 解析は続けられるが、ユーザーに知らせること（握りつぶさない）
      if (sourceUrl) {
        // メタ情報と本文を同時取得（本文が読めれば分類はほぼそれで決まる）。YouTubeは公式oEmbed＋サムネも並行で取る。
        // 材料の元データ＝レシピサイトはページのレシピ情報、YouTubeは概要欄（キーがある時だけ）も並行で取る
        [urlMeta, pageText, yt, ytDesc, recipeLd] = await Promise.all([
          fetchUrlMeta(sourceUrl), fetchPageText(sourceUrl), ytId ? fetchYouTube(ytId) : Promise.resolve(null),
          ytId && ytKey ? fetchYtDesc(ytId, ytKey) : Promise.resolve(null),
          ytId ? Promise.resolve(null) : fetchRecipeData(sourceUrl),
        ]);
      }
      const ytDescText = ytDesc && ytDesc.description ? ytDesc.description : "";
      if (ytDesc && ytDesc.error) notes.push(`※${ytDesc.error}`);

      let contextText = text || "";
      if (urlMeta) {
        contextText += `\n\n[ページ情報]\nURL: ${sourceUrl}\nタイトル: ${urlMeta.title}\n発信元: ${urlMeta.publisher}\n説明: ${urlMeta.description}`;
      } else if (sourceUrl) {
        contextText += `\n\n[ページ情報]\nURL: ${sourceUrl}`;
      }
      if (yt) {
        const thumbNote = (!img && yt.thumbData) ? "添付画像はこの動画のサムネイル。" : ""; // 写真も一緒に放り込まれた時は写真を優先して見せる
        const ytTitle = (yt.meta && yt.meta.title) || (ytDesc && ytDesc.title) || "";

  function remindAtFor(dateStr, startTime, allDay, preset) {

    let base;
    if (preset === "morning") {
      base = new Date(y, mo - 1, d, 7, 30);             // 当日朝7:30
    } else {
      let hh = 9, mm = 0;                               // 終日/時刻なしは9:00基準
      if (!allDay && startTime) { const t = startTime.split(":"); hh = +t[0]; mm = +t[1]; }

      if (preset === "b10") base = new Date(base - 10 * 60000);
      else if (preset === "b60") base = new Date(base - 60 * 60000);
      else if (preset === "prev") base = new Date(base - 24 * 60 * 60000);

    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}

  function setRecipeDate(id, d) {

  }

  function toggleShopRow(row) {
    const next = !row.have;
    setItems(prev => prev.map(x => {
      const mine = row.refs.filter(ref => ref.id === x.id);
      if (!mine.length) return x;
      return { ...x, ingredients: (x.ingredients || []).map((g, i) => mine.some(ref => ref.idx === i) ? { ...g, have: next } : g) };
    }));
  }
  function shareShopList(recipes, rows) {
    const need = rows.filter(r => !r.have);

    const lines = [
      `■ 今週の買い物（${today.getMonth()+1}/${today.getDate()}〜${end.getMonth()+1}/${end.getDate()}）`,
      `（${recipes.map(r => r.title).join("・")}）`,
      ...need.map(r => `・${r.name}${r.qty ? " " + r.qty : ""}${r.guess ? "（推定）" : ""}`),
    ];
    if (need.some(r => r.guess)) lines.push("※（推定）＝料理名から出した目安の材料");
    shareOrCopy(lines.join("\n"), setShopMsg);
  }

  // ── 題名・写真の編集 ──
  function openEdit(it) {
    setEditId(it.id); setEditTitle(it.title || ""); setEditCover(it.cover || null);

  }
  // 「内容不明」で入ってしまったYouTubeカードの救済：公式oEmbedから題名、公式サムネから写真を取り直す（AI・キー不要）
  async function refetchYt(it) {
    const id = ytOf(it);
    if (!id) return;
    setEditBusy(true); setEditMsg("");
    try {
      const y = await fetchYouTube(id);
      const th = await ytCardThumb(id);
      setEditCover(th); setEditPos({ x: 50, y: 50, z: 1 });
      if (y.meta && y.meta.title) { setEditTitle(y.meta.title.slice(0, 80)); setEditMsg(`YouTubeの題名とサムネを入れました${y.meta.author ? `（${y.meta.author}）` : ""}。長ければ短く直して「保存する」を押してください。`); }
      else setEditMsg("動画の題名は取れませんでした（非公開・削除などの可能性）。サムネだけ入れました。");
    } catch (e) {
      setEditMsg("取り直せませんでした。通信を確認して、もう一度試してください。");
    } finally { setEditBusy(false); }
  }
  function saveEdit() {
    const t = editTitle.trim();
    if (!t) return;
    setItems(prev => prev.map(x => {
      if (x.id !== editId) return x;
      const n = { ...x };
      if (t !== x.title) { if (!n.origTitle) n.origTitle = x.title; n.title = t; }
      if (editCover) n.cover = editCover; else delete n.cover;
      const p = editPos;
      if (p.x === 50 && p.y === 50 && (p.z || 1) === 1) delete n.coverPos; else n.coverPos = p;
      return n;
    }));
    setEditId(null);
  }
  async function pickCover(e) {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    try {
      setEditCover(await compressImage(await blobToDataUrl(file), 900, 0.6));
      setEditPos({ x: 50, y: 50, z: 1 });
    } catch (err) { alert("写真を読み込めませんでした。別の写真で試してください。"); }
  }
  // 写真の位置合わせ（ドラッグ）。指を右へ動かす＝写真の左側が見える
  function coverDragStart(e) {
    const r = e.currentTarget.getBoundingClientRect();
    dragRef.current = { sx: e.clientX, sy: e.clientY, x: editPos.x, y: editPos.y, w: r.width, h: r.height };
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function coverDragMove(e) {
    const d = dragRef.current;
    if (!d) return;
    const k = 1 / (editPos.z || 1);
    const nx = Math.max(0, Math.min(100, d.x - (e.clientX - d.sx) / d.w * 100 * k));
    const ny = Math.max(0, Math.min(100, d.y - (e.clientY - d.sy) / d.h * 100 * k));
    setEditPos(p => ({ ...p, x: Math.round(nx), y: Math.round(ny) }));
  }
  function coverDragEnd() { dragRef.current = null; }

                                 .sort((a,b) => (a.done?1:0)-(b.done?1:0) || (a.time||"99:99").localeCompare(b.time||"99:99"));

                const thumb = coverOf(it);
                return (
                  <div key={id} style={S.hitCard}>
                    {thumb
                      ? <img src={thumb} alt="" style={S.hitThumb} onError={e=>{e.target.style.display='none';}} />

                    <div style={{flex:1, minWidth:0}}>
                      <div style={S.hitTitle}>{it.title}</div>
                      <div style={S.hitBtns}>
                        {it.sourceUrl && (
                          <a href={it.sourceUrl} target="_blank" rel="noopener noreferrer" style={S.hitBtn}>🔗 開く</a>

                        {it.category === "basho" && (
                          <a href={`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent([it.title, it.meta].filter(Boolean).join(" "))}`}

                        )}
                        {it.date
                          ? <span style={{...S.hitBtn, background:"rgba(120,120,150,0.1)", color:"#8a8a9a", cursor:"default"}}>📅 {(()=>{const p=it.date.split("-");return `${+p[1]}/${+p[2]}`;})()} 予定済み</span>
                          : (planId === id
                            ? <span style={S.hitPlanRow}>
                                <input type="date" style={S.hitDateInput} value={planDate} onChange={e=>setPlanDate(e.target.value)} />
                                <span style={{...S.hitBtn, background:"linear-gradient(120deg,#16161e,#34344a)", color:"#fff"}} onClick={()=>planItem(id, planDate)}>入れる ✓</span>
                              </span>
                            : <span style={{...S.hitBtn, background:"rgba(155,107,255,0.14)", color:"#8b54f5"}} onClick={()=>{setPlanId(id); setPlanDate(toDateStr(new Date()));}}>📅 予定に入れる</span>)}
                      </div>
                    </div>
                  </div>
                );
              })}
              <div style={S.sheetBtns}>
                <button style={S.btnGhost} onClick={()=>setAskOpen(false)} disabled={askBusy}>閉じる</button>
                <button style={{...S.btnMain, ...(askBusy||!askInput.trim()?{opacity:0.5}:{})}}
                  onClick={()=>askBox(askInput)} disabled={askBusy||!askInput.trim()}>
                  {askBusy ? "AIが探し中…" : "聞く →"}
                </button>
              </div>
              {/* ワンタップ想起：状況ボタン＝タップだけでAIが答える（考えさせない） */}
              <div style={S.samples}>
                <div style={S.samplesLabel}>ワンタップで聞く：</div>
                <div style={S.presetWrap}>
                  {ASK_PRESETS.map((p,i)=>(
                    <div key={i} style={S.presetChip}
                      onClick={()=>{ if(askBusy) return; setAskInput(p.q); askBox(p.q, { preset: p }); }}>

                    </div>

                </div>
              </div>
            </div>

        {/* 放り込みシート */}
        {sheet && (
          <div style={S.sheetWrap} onClick={()=>!busy && setSheet(false)}>
            <div style={S.sheet} onClick={e=>e.stopPropagation()}>
              <div style={S.sheetGrip}/>
              {busy ? (
                <>
                  <div style={S.sheetTitle}>AIが解析中…</div>
                  <div style={S.sheetSub}>放り込んだ内容を読み取って、ぴったりの箱に仕分けています</div>
                  <div style={S.scanHero}>
                    {image
                      ? <img src={image} alt="" style={S.scanHeroImg} onError={e=>{e.target.style.display='none';}} />
                      : <div style={{position:"absolute",inset:0,padding:"22px 20px",fontSize:14,lineHeight:1.6,color:"rgba(220,235,255,0.92)",fontWeight:600,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:5,WebkitBoxOrient:"vertical"}}>{input || "気になるを解析中"}</div>}
                    {image && <div style={S.scanHeroTint}/>}
                    <div style={S.scanHudMark}>ANALYZING</div>
                    <ScanFX loop={true} />
                    <div style={S.scanHud}>読み取り中…</div>
                  </div>
                </>
              ) : !result ? (
                <>
                  <div style={S.sheetTitle}>気になるを放り込む</div>
                  <div style={S.sheetSub}>URL・テキスト・予定の案内など、何でも貼ってOK</div>
                  <textarea
                    style={S.textarea}
                    placeholder="例：LINEで来たイベント案内を貼り付け、URLを貼る、「渋谷の○○ってバー行きたい」など"
                    value={input}
                    onChange={e=>setInput(e.target.value)}
                    disabled={busy}
                  />
                  <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={pickImage} />
                  {!image ? (
                    <div style={{display:"flex", gap:8}}>
                      <div style={{...S.photoBtn, flex:1, marginTop:0}} onClick={()=>fileRef.current?.click()}>
                        <span style={{fontSize:18}}>🖼</span>
                        <span>写真・スクショ</span>
                      </div>
                      <div style={{...S.photoBtn, flex:1, marginTop:0}} onClick={()=>cameraRef.current?.click()}>

                  ) : (
                    <div style={S.photoPreview}>

                      <div style={{flex:1}}>
                        <div style={{fontSize:13, fontWeight:700, color:"#1a1a24"}}>写真を放り込みました</div>
                        <div style={{fontSize:11, color:"#9a9aaa", marginTop:2}}>AIが画像を読み取ります</div>
                        {pendingPlace && <div style={{fontSize:11, fontWeight:800, color:"#1690d8", marginTop:3}}>{pendingPlace}</div>}
                      </div>
                      <div style={S.photoX} onClick={()=>{setImage(null); pendingGeoRef.current=null; setPendingPlace("");}}>✕</div>
                    </div>
                  )}
                  {error && <div style={S.error}>{error}</div>}
                  <div style={S.sheetBtns}>
                    <button style={S.btnGhost} onClick={()=>setSheet(false)} disabled={busy}>やめる</button>
                    <button style={{...S.btnMain, ...(busy||(!input.trim()&&!image)?{opacity:0.5}:{})}}
                      onClick={()=>analyze(input, image)} disabled={busy||(!input.trim()&&!image)}>
                      {busy ? "AIが読み取り中…" : "AIにまかせる →"}
                    </button>
                  </div>
                  <div style={S.samples}>
                    <div style={S.samplesLabel}>試しに放り込む（テキスト）：</div>
                    {[
                      "7月3日19時からオンライン勉強会。AI活用がテーマ。",
                      "G-SHOCK GW-B5600 楽天で28,600円。黒のやつ欲しい",
                      "来週金曜までに資料作る",
                      "https://note.com/ AIで業務自動化する方法まとめ"
                    ].map((s,i)=>(
                      <div key={i} style={S.sampleChip} onClick={()=>{setInput(s);}}>{s.slice(0,22)}…</div>
                    ))}
                  </div>
                </>
              ) : (
                <>
                  <div style={S.sheetTitle}>AIが読み取りました</div>
                  <div style={S.preview}>
                    <div style={{...S.previewHero, background:catOf(result.category).grad}}>
                      {(result._img || result.image) && <img src={result._img || result.image} alt="" style={S.previewImg} onError={e=>{e.target.style.display='none';}} />}
                      <span style={S.cardCat}>{catOf(result.category).label}</span>
                    </div>
                    <div style={{padding:"14px 16px 16px"}}>
                      <input style={S.resultTitleInput} value={result.title || ""} maxLength={80} aria-label="題名"

                      <div style={S.resultTitleHint}>✎ 題名はタップして直せます</div>
                      {result.meta && <div style={S.cardMeta}>{result.meta}</div>}
                      {result.chip && result.category !== "money" && <span style={{...S.cardChip, background:catOf(result.category).chip, color:catOf(result.category).chipC}}>{result.chip}</span>}
                    </div>
                  </div>
                  {error && <div style={{...S.error, marginTop:0, marginBottom:12}}>{error}</div>}
                  {result.category==="recipe" && (() => {
                    const ings = result.ingredients || [];
                    const src = ING_SRC[result.ingSrc];
                    return (
                      <div style={S.ingPreview}>
                        <div style={S.ingPreviewHead}>
                          材料{result.servings ? `（${result.servings}）` : ""}{ings.length ? ` ${ings.length}品` : ""}
                          {src && ings.length>0 && <span style={{...S.ingBadge, color:src.color, background:src.bg}}>{src.label}</span>}
                        </div>
                        {ings.length
                          ? <div style={S.ingPreviewList}>{ings.slice(0,8).map(g=>g.name+(g.qty?` ${g.qty}`:"")).join("・")}{ings.length>8?` ほか${ings.length-8}品`:""}</div>
                          : <div style={S.ingPreviewList}>材料は見つかりませんでした。箱に入れた後、カードの「材料を出す」から、材料が映った画面のスクショなどで読み取れます。</div>}
                        {result.ingSrc==="guess" && ings.length>0 && (
                          <div style={{...S.ingWarn, marginTop:8, marginBottom:0}}>動画やページに書いてあった材料ではなく、料理名から出した一般的な材料です。箱に入れた後、材料が映った場面のスクショで正確にできます。</div>
                        )}
                      </div>
                    );
                  })()}
                  {(result.category==="event"||result.category==="task") && (
                    <>
                      <div style={S.fieldLabel}>
                        日付
                        {result.date
                          ? <span style={{marginLeft:6,fontSize:10,color:"#22c55e",fontWeight:700}}>✓ AIが読み取り済み</span>
                          : <span style={{marginLeft:6,fontSize:10,color:"#f59e0b"}}>日付が見つかりません — 手動で設定</span>
                        }
                      </div>
                      <input type="date" style={{...S.dateInput,...(result.date?{borderColor:"#22c55e"}:{})}}
                        value={resultDate} onChange={e=>setResultDate(e.target.value)} />
                      {result.category==="event" && (
                        <>
                          <div style={S.fieldLabel}>
                            時刻
                            {result.time && <span style={{marginLeft:6,fontSize:10,color:"#22c55e",fontWeight:700}}>✓ AIが読み取り済み</span>}
                          </div>
                          <div style={S.addRow}>
                            <input type="time" style={{...S.timeInput,...(result.time?{borderColor:"#22c55e"}:{})}} value={resultTime} onChange={e=>setResultTime(e.target.value)} />
                            <span style={{fontSize:14, color:"#b0b0bc", fontWeight:700}}>→</span>
                            <input type="time" style={S.timeInput} value={resultEnd} onChange={e=>setResultEnd(e.target.value)} />
                          </div>
                        </>
                      )}
                      {result.category==="task" && (
                        <>
                          <div style={S.fieldLabel}>時刻（任意）</div>
                          <div style={S.addRow}>
                            <input type="time" style={S.timeInput} value={resultTime} onChange={e=>setResultTime(e.target.value)} />
                          </div>
                        </>
                      )}
                      <div style={S.fieldLabel}>
                        場所
                        {result.place && <span style={{marginLeft:6,fontSize:10,color:"#22c55e",fontWeight:700}}>✓ AIが読み取り済み</span>}
                      </div>
                      <input type="text" placeholder="会場・店名・住所（あれば）" style={{...S.dateInput,...(result.place?{borderColor:"#22c55e"}:{})}}
                        value={resultPlace} onChange={e=>setResultPlace(e.target.value)} />

                    <>
                      <div style={S.fieldLabel}>

                          : <span style={{marginLeft:6,fontSize:10,color:"#f59e0b"}}>読み取れませんでした — 入れてください</span>}
                      </div>
                      <div style={{...S.moneyRow, ...(parseAmount(resultAmount)?{}:{borderColor:"#f59e0b"})}}>

                      <input type="date" style={S.dateInput} value={resultDate} onChange={e=>setResultDate(e.target.value)} />

                      <span style={S.resultGoUrl}>{String(result.link).replace(/^https?:\/\/(www\.)?/,"").slice(0,38)}</span>
                    </a>

                  <div style={S.reclassLabel}>違ったら選び直す</div>
                  <div style={S.reclass}>
                    {Object.entries(CATS).map(([k,v])=>(
                      <div key={k} onClick={()=>setResult({...result, category:k})}
                        style={{...S.reclassChip, ...(k===result.category?{background:v.grad, color:"#fff", borderColor:"transparent"}:{})}}>

                      return <button style={{...S.btnMain, ...(ng?{opacity:0.5}:{})}} onClick={confirmAdd} disabled={ng}>{ng ? "金額を入れてください" : "箱に入れる ✓"}</button>;

        {/* 今週の買い物リスト：今日から7日間に作るレシピの材料を1枚に。丸は各レシピの材料シートと同期（材料シートはこの上に重なる） */}
        {shopOpen && (() => {
          const recipes = weekRecipes(items, today);
          const rows = buildShopRows(recipes);
          const need = rows.filter(r => !r.have).length;
          const shown = shopOnlyNeed ? rows.filter(r => !r.have) : rows;
          const noIng = recipes.filter(r => !(r.ingredients || []).length);
          const end = new Date(today); end.setDate(end.getDate() + 6);
          return (
            <div style={S.sheetWrap} onClick={()=>setShopOpen(false)}>
              <div style={S.sheet} onClick={e=>e.stopPropagation()}>
                <div style={S.sheetGrip}/>
                <div style={S.sheetTitle}>今週の買い物</div>
                <div style={S.sheetSub}>{mdw(toDateStr(today))}〜{mdw(toDateStr(end))}に作るレシピの材料をまとめました。同じ材料は1行に寄せ、分量は足し算せずに並べています。</div>
                {recipes.length === 0 ? (
                  <div style={S.ingEmpty}>今日から7日間に作るレシピがありません。レシピの「材料」を開いて「作る日」を入れると、ここに材料が集まります。</div>

                  <>

                      <>

                            <div key={r.key} style={{...S.ingRow, alignItems:"flex-start", ...(i===0?{borderTop:"none"}:{})}} onClick={()=>toggleShopRow(r)}>

                              <span style={{flex:1, minWidth:0}}>
                                <span style={{...S.ingName, display:"block", ...(r.have?S.ingDone:{})}}>

                        <button style={{...S.btnMain, width:"100%", flex:"none", marginTop:12, ...(need?{}:{opacity:0.5})}} disabled={!need} onClick={()=>shareShopList(recipes, rows)}>

                  <button style={S.btnGhost} onClick={()=>setShopOpen(false)}>閉じる</button>

        {/* レシピの材料シート：材料の一覧（家にある物に丸）→ 買うものを送る／材料の読み取り直し */}

          const it = (items || []).find(x => x.id === recipeId);
          if (!it) return null;
          const ings = it.ingredients || [];
          const need = ings.filter(g => !g.have).length;
          const src = ING_SRC[it.ingSrc];
          const img = coverOf(it);
          const ytId = ytOf(it);
          return (
            <div style={S.sheetWrap} onClick={()=>!ingBusy && setRecipeId(null)}>
              <div style={S.sheet} onClick={e=>e.stopPropagation()}>
                <div style={S.sheetGrip}/>

                  {img && <img src={img} alt="" style={{...S.previewImg, ...coverFx(it.coverPos)}} onError={e=>{e.target.style.display='none';}} />}
                  <span style={S.cardCat}>レシピ</span>
                  <span style={S.recipeEditBtn} onClick={()=>openEdit(it)}>✎ 題名・写真</span>
                </div>
                <div style={S.recipeTitle}>{it.title}</div>
                {it.meta && <div style={S.cardMeta}>{it.meta}</div>}
                {it.sourceUrl && !it.searchLabel && (

                  {it.date && <span style={S.cookClear} onClick={()=>setRecipeDate(it.id, "")}>外す</span>}

                  const inWeek = weekRecipes([it], today).length > 0;

                    <div style={S.cookNote}>
                      {mdw(it.date)}に作る予定です（カレンダーに出ます）。
                      {inWeek
                        ? <span style={S.cookLink} onClick={()=>{ setRecipeId(null); openShop(); }}>今週の買い物リストを見る ›</span>
                        : past
                        ? <span>この日はもう過ぎています。</span>
                        : <span>今日から7日以内になると、今週の買い物リストに材料が入ります。</span>}
                    </div>
                  );
                })()}

                <div style={S.ingHeadRow}>
                  <span style={S.ingHeadTitle}>材料{it.servings ? `（${it.servings}）` : ""}</span>
                  {src && ings.length>0 && <span style={{...S.ingBadge, color:src.color, background:src.bg}}>{src.label}</span>}
                  {ings.length>0 && <span style={S.ingEditToggle} onClick={()=>setIngEdit(!ingEdit)}>{ingEdit ? "完了" : "編集"}</span>}
                </div>
                {it.ingSrc==="guess" && ings.length>0 && (
                  <div style={S.ingWarn}>動画やページに書いてあった材料ではなく、料理名から出した<b>一般的な材料（目安）</b>です。正確にしたいときは、下の{ytId ? "「概要欄から」か" : ""}「画面のスクショから」で読み取ってください。</div>
                )}
                {it.ingUrl && ings.length>0 && (
                  <a href={it.ingUrl} target="_blank" rel="noopener noreferrer" style={S.ingFromLink}>材料はこのページから ↗ {it.ingUrl.replace(/^https?:\/\//, "").slice(0, 40)}</a>
                )}
                {ings.length===0
                  ? <div style={S.ingEmpty}>まだ材料がありません。下のボタンで読み取れます。</div>
                  : (
                    <div style={S.ingList}>
                      {ings.map((g,i)=>(
                        <div key={i} style={{...S.ingRow, ...(i===0?{borderTop:"none"}:{})}}
                          onClick={()=>{ if(!ingEdit) updateIng(it.id, arr => arr.map((x,j)=> j===i ? {...x, have:!x.have} : x)); }}>
                          <span style={{...S.ingCheck, ...(g.have?S.ingCheckOn:{})}}>{g.have ? "✓" : ""}</span>
                          <span style={{...S.ingName, ...(g.have?S.ingDone:{})}}>{g.name}</span>
                          <span style={{...S.ingQty, ...(g.have?S.ingDone:{})}}>{g.qty}</span>
                          {ingEdit && <span style={S.ingDel} onClick={e=>{e.stopPropagation(); updateIng(it.id, arr => arr.filter((_,j)=>j!==i));}}>✕</span>}
                        </div>
                      ))}
                    </div>
                  )}
                {ings.length>0 && <div style={S.ingHint}>丸をタップ＝家にある・買った（送るリストから外れます）</div>}
                <div style={S.ingAddRow}>
                  <input style={S.ingAddInput} placeholder="＋ 材料を足す（例：豚バラ 200g）" value={ingAdd}
                    onChange={e=>setIngAdd(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") addIng(it.id); }} />
                  <span style={{...S.ingAddBtn, ...(ingAdd.trim()?{}:{opacity:0.4})}} onClick={()=>addIng(it.id)}>追加</span>
                </div>
                {ings.length>0 && (
                  <button style={{...S.btnMain, width:"100%", flex:"none", marginTop:12, ...(need?{}:{opacity:0.5})}} disabled={!need} onClick={()=>shareIngredients(it)}>
                    {need ? `買うものを送る・コピー（${need}品）` : "全部そろっています"}
                  </button>
                )}
                {ingMsg && <div style={S.ingMsg}>{ingMsg}</div>}

                <div style={S.ingReadHead}>{ings.length ? "材料を読み取り直す" : "材料を読み取る"}</div>
                <div style={S.ingReadGrid}>
                  {/* 元データ（書いてあるとおり）を先に並べる：YouTube＝概要欄／レシピサイト＝ページのレシピ情報 */}
                  {ytId && (
                    <div style={{...S.ingReadBtn, ...S.ingReadBtnMain, ...(ingBusy?{opacity:0.5}:{})}} onClick={()=>{ if(!ingBusy) readIngredients(it.id, "desc"); }}>
                      ▶ 概要欄から<span style={S.ingReadSub}>{ytKey ? "動画の説明文を読む" : "要：YouTubeのキー（⚙）"}</span>
                    </div>
                  )}
                  {it.sourceUrl && !ytId && !it.searchLabel && (
                    <div style={{...S.ingReadBtn, ...S.ingReadBtnMain, ...(ingBusy?{opacity:0.5}:{})}} onClick={()=>{ if(!ingBusy) readIngredients(it.id, "page"); }}>
                      🔗 ページから<span style={S.ingReadSub}>レシピ欄を書いてあるとおり</span>
                    </div>
                  )}
                  <div style={{...S.ingReadBtn, ...(ingBusy?{opacity:0.5}:{})}} onClick={()=>{ if(!ingBusy) ingImgRef.current?.click(); }}>
                    📷 画面のスクショから<span style={S.ingReadSub}>材料が映った場面（3枚まで）</span>
                  </div>
                  <div style={{...S.ingReadBtn, ...(ingBusy?{opacity:0.5}:{}), ...(ingPaste!==null?{borderColor:"#16161e"}:{})}} onClick={()=>{ if(!ingBusy) setIngPaste(ingPaste===null ? "" : null); }}>
                    📝 文章を貼って<span style={S.ingReadSub}>概要欄・メモなど</span>
                  </div>
                  <div style={{...S.ingReadBtn, ...(ingBusy?{opacity:0.5}:{})}} onClick={()=>{ if(!ingBusy) readIngredients(it.id, "guess"); }}>
                    💡 料理名から推定<span style={S.ingReadSub}>一般的な材料（目安）</span>
                  </div>
                </div>
                {ingPaste !== null && (
                  <>
                    <div style={S.pasteBtn} onClick={async()=>{
                      if (ingBusy) return;
                      try {
                        const t = await navigator.clipboard.readText();
                        if (t && t.trim()) setIngPaste(t); else setIngMsg("コピーされた文字がありませんでした。先に概要欄などの文章をコピーしてください。");
                      } catch (e) { setIngMsg("貼り付けが許可されませんでした。下の入力欄を長押しして「ペースト」してください。"); }
                    }}>📋 コピーした文章をここに貼る</div>
                    <textarea style={{...S.textarea, minHeight:90, marginTop:8}} placeholder="YouTubeの概要欄やレシピの文章を貼り付け"
                      value={ingPaste} onChange={e=>setIngPaste(e.target.value)} disabled={ingBusy} />
                    <button style={{...S.btnMain, width:"100%", flex:"none", marginTop:8, ...(!ingPaste.trim()||ingBusy?{opacity:0.5}:{})}}
                      disabled={!ingPaste.trim()||ingBusy} onClick={()=>readIngredients(it.id, "text", ingPaste)}>この文章から読み取る</button>
                  </>
                )}
                {ingBusy && <div style={S.ingBusy}>材料を読み取り中…</div>}
                <input ref={ingImgRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>onIngImages(e, it.id)} />
                <div style={S.sheetBtns}>
                  <button style={S.btnGhost} onClick={()=>setRecipeId(null)} disabled={ingBusy}>閉じる</button>
                </div>
              </div>
            </div>
          );
        })()}

        {/* 題名・写真の編集シート（材料シートの上に重なる） */}
        {editId && (() => {
          const it = (items || []).find(x => x.id === editId);
          if (!it) return null;
          const orig = it._img || it.image || "";
          const shown = editCover === "none" ? "" : (editCover || orig);
          const ytId = ytOf(it);
          const frames = [["maxresdefault","サムネ"],["maxres1","場面1"],["maxres2","場面2"],["maxres3","場面3"]];
          return (
            <div style={S.sheetWrap} onClick={()=>!editBusy && setEditId(null)}>
              <div style={S.sheet} onClick={e=>e.stopPropagation()}>
                <div style={S.sheetGrip}/>
                <div style={S.sheetTitle}>題名・写真を編集</div>
                <div style={S.fieldLabel}>題名</div>
                <textarea style={{...S.textarea, minHeight:64}} value={editTitle} maxLength={80} onChange={e=>setEditTitle(e.target.value)} />
                {it.origTitle && editTitle !== it.origTitle && (
                  <div style={S.revertLink} onClick={()=>setEditTitle(it.origTitle)}>↺ 元の題名に戻す（{it.origTitle.length > 22 ? it.origTitle.slice(0,22) + "…" : it.origTitle}）</div>
                )}
                <div style={S.fieldLabel}>写真（カードではこう見えます）</div>
                <div style={{...S.coverBox, ...(shown?{}:{background:(CATS[it.category]||CATS.joho).grad, cursor:"default"})}}
                  onPointerDown={shown ? coverDragStart : undefined} onPointerMove={shown ? coverDragMove : undefined}
                  onPointerUp={coverDragEnd} onPointerCancel={coverDragEnd}>
                  {shown
                    ? <img src={shown} alt="" draggable={false} style={{...S.previewImg, ...coverFx(editPos), pointerEvents:"none"}} onError={e=>{e.target.style.display='none';}} />
                    : <span style={S.coverNone}>写真なし（色のカードになります）</span>}
                </div>
                {shown && <div style={S.coverHint}>写真をドラッグで位置合わせ・下のつまみで拡大</div>}
                {shown && (
                  <input type="range" min="1" max="3" step="0.05" value={editPos.z || 1} aria-label="拡大"
                    onChange={e=>setEditPos(p=>({...p, z:+e.target.value}))} style={S.coverZoom} />
                )}
                <div style={S.coverBtns}>
                  <div style={S.coverBtn} onClick={()=>coverFileRef.current?.click()}>🖼 写真を選ぶ</div>
                  {ytId && <div style={{...S.coverBtn, ...(editFrames?S.coverBtnOn:{})}} onClick={()=>setEditFrames(!editFrames)}>🎬 動画の場面から</div>}
                  {editCover !== null && <div style={S.coverBtn} onClick={()=>{ setEditCover(null); setEditPos({x:50,y:50,z:1}); }}>↺ 元の写真</div>}
                  {shown && <div style={S.coverBtn} onClick={()=>setEditCover("none")}>写真なし</div>}
                  {(shown && (editPos.x!==50 || editPos.y!==50 || (editPos.z||1)!==1)) && <div style={S.coverBtn} onClick={()=>setEditPos({x:50,y:50,z:1})}>位置を戻す</div>}
                </div>
                {editFrames && ytId && (
                  <div style={S.frameGrid}>
                    {frames.map(([n, label]) => {
                      const on = editCover && (editCover.endsWith(`/${n}.jpg`) || editCover.endsWith(`/${YT_FRAME_FALLBACK[n]}.jpg`));
                      return (
                        <div key={n} style={{...S.frameCell, ...(on?S.frameCellOn:{})}}
                          onClick={e=>{ const im = e.currentTarget.querySelector("img"); if (!im || im.style.display==="none") return; setEditCover(im.src); setEditPos({x:50,y:50,z:1}); }}>
                          <img src={ytThumb(ytId, n)} alt="" style={S.frameImg}
                            onError={e=>{ const fb = YT_FRAME_FALLBACK[n]; if (!e.target.dataset.fb) { e.target.dataset.fb = "1"; e.target.src = ytThumb(ytId, fb); } else e.target.style.display = "none"; }} />
                          <span style={S.frameLabel}>{label}</span>
                        </div>
                      );
                    })}
                  </div>
                )}
                {ytId && (
                  <div style={{...S.coverBtn, marginTop:10, textAlign:"center", ...(editBusy?{opacity:0.5}:{})}} onClick={()=>{ if(!editBusy) refetchYt(it); }}>
                    {editBusy ? "YouTubeから取得中…" : "↻ YouTubeから題名・サムネを取り直す"}
                  </div>
                )}
                {editMsg && <div style={S.ingMsg}>{editMsg}</div>}
                <input ref={coverFileRef} type="file" accept="image/*" style={{display:"none"}} onChange={pickCover} />
                <div style={S.sheetBtns}>
                  <button style={S.btnGhost} onClick={()=>setEditId(null)} disabled={editBusy}>やめる</button>
                  <button style={{...S.btnMain, ...(editTitle.trim()&&!editBusy?{}:{opacity:0.5})}} disabled={!editTitle.trim()||editBusy} onClick={saveEdit}>保存する ✓</button>
                </div>
              </div>
            </div>
          );
        })()}

        {/* 画像ライトボックス */}
        {lightbox && (
          <div style={S.lbWrap} onClick={()=>setLightbox(null)}>
            <img src={lightbox} alt="" style={S.lbImg} />
            <div style={S.lbClose}>✕</div>
          </div>
        )}

        {/* 家計簿（月ごと）：合計・費目別・日ごと。行をタップ＝直す */}
        {kakeiMonth && (() => {
          const [ky, km] = kakeiMonth.split("-").map(Number);
          const list = (items || []).filter(it => isMoney(it) && (it.date || "").startsWith(kakeiMonth))
            .sort((a, b) => (b.date || "").localeCompare(a.date || "") || (Number(b.id) || 0) - (Number(a.id) || 0));
          const total = list.reduce((a, it) => a + (it.amount || 0), 0);
          const byHim = {};
          list.forEach(it => { const h = it.himoku || "その他"; byHim[h] = (byHim[h] || 0) + (it.amount || 0); });
          const hims = Object.entries(byHim).sort((a, b) => b[1] - a[1]);
          const max = hims.length ? hims[0][1] : 0;
          const days = [];
          list.forEach(it => { const last = days[days.length - 1]; if (last && last[0] === it.date) last[1].push(it); else days.push([it.date, [it]]); });
          const noAmt = list.filter(it => !it.amount).length;
          const shift = d => { const dt = new Date(ky, km - 1 + d, 1); setKakeiMonth(`${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}`); };
          return (
            <div style={S.sheetWrap} onClick={()=>setKakeiMonth(null)}>
              <div style={S.sheet} onClick={e=>e.stopPropagation()}>
                <div style={S.sheetGrip}/>
                <div style={S.kakeiHead}>
                  <span style={S.kakeiNav} onClick={()=>shift(-1)}>‹</span>
                  <span style={{...S.sheetTitle, marginBottom:0}}>💴 {ky}年{km}月の家計簿</span>
                  <span style={S.kakeiNav} onClick={()=>shift(1)}>›</span>
                </div>
                <div style={S.kakeiTotal}>{fmtYen(total)}<span style={S.kakeiCount}>{list.length}件</span></div>
                {noAmt > 0 && <div style={{...S.ingWarn, marginBottom:10}}>金額が入っていない支出が{noAmt}件あります（¥0で数えています）。行をタップして直せます。</div>}
                {list.length === 0 ? (
                  <div style={S.agendaEmpty}>この月の支出はまだありません。レシートを撮って放り込むか、カレンダーの日付をタップして「支出」で入れられます。</div>
                ) : (
                  <>
                    <div style={S.fieldLabel}>費目別</div>
                    {hims.map(([h, v]) => (
                      <div key={h} style={S.kakeiBarRow}>
                        <span style={S.kakeiBarLbl}>{h}</span>
                        <span style={S.kakeiBarTrack}><span style={{...S.kakeiBarFill, width:`${max ? Math.max(3, v / max * 100) : 0}%`}}/></span>
                        <span style={S.kakeiBarAmt}>{fmtYen(v)}</span>
                        <span style={S.kakeiBarPct}>{total ? Math.round(v / total * 100) : 0}%</span>
                      </div>
                    ))}
                    <div style={S.fieldLabel}>日ごと</div>
                    {days.map(([d, its]) => (
                      <div key={d} style={S.kakeiDay}>
                        <div style={S.kakeiDayHead}><span>{mdw(d)}</span><span>{fmtYen(its.reduce((a, it) => a + (it.amount || 0), 0))}</span></div>
                        {its.map(it => (
                          <div key={it.id} style={S.kakeiRow} onClick={()=>openMoneyEdit(it)}>
                            <span style={S.kakeiRowTitle}>{it.title}</span>
                            <span style={S.kakeiRowHim}>{it.himoku || "その他"}</span>
                            <span style={{...S.kakeiRowAmt, ...(it.amount ? {} : {color:"#d97706"})}}>{it.amount ? fmtYen(it.amount) : "金額なし"}</span>
                          </div>
                        ))}
                      </div>
                    ))}
                  </>
                )}
                <div style={S.sheetBtns}>
                  <button style={S.btnGhost} onClick={()=>setKakeiMonth(null)}>閉じる</button>
                  <button style={S.btnMain} onClick={()=>{
                    const d = kakeiMonth === toDateStr(today).slice(0, 7) ? toDateStr(today) : kakeiMonth + "-01";
                    setKakeiMonth(null); openDayAdd(d, "money");
                  }}>＋ 支出を手で入れる</button>
                </div>
              </div>
            </div>
          );
        })()}

        {/* 支出を直す（家計簿・その日の支出・カードの⋮から）。家計簿の上に重なる */}
        {moneyEdit && (
          <div style={{...S.sheetWrap, zIndex:2050}} onClick={()=>setMoneyEdit(null)}>
            <div style={S.sheet} onClick={e=>e.stopPropagation()}>
              <div style={S.sheetGrip}/>
              <div style={S.sheetTitle}>💴 支出を直す</div>
              <div style={{...S.moneyRow, ...(parseAmount(moneyEdit.amount)?{}:{borderColor:"#f59e0b"})}}>
                <span style={S.moneyYen}>¥</span>
                <input style={S.moneyInput} inputMode="numeric" placeholder="いくら？" value={moneyEdit.amount}
                  onChange={e=>setMoneyEdit({...moneyEdit, amount:e.target.value.replace(/[^\d０-９]/g, "")})} />
              </div>
              <div style={S.chipRow}>
                {HIMOKU.map(h => <div key={h} onClick={()=>setMoneyEdit({...moneyEdit, himoku:h})} style={{...S.rChip, ...(moneyEdit.himoku===h?S.moneyChipOn:{})}}>{h}</div>)}
              </div>
              <div style={S.fieldLabel}>お店・メモ</div>
              <input style={{...S.dateInput, fontSize:16}} value={moneyEdit.title} placeholder="なくてもOK（費目の名前になります）"
                onChange={e=>setMoneyEdit({...moneyEdit, title:e.target.value})} />
              <div style={S.fieldLabel}>買った日</div>
              <input type="date" style={S.dateInput} value={moneyEdit.date} onChange={e=>setMoneyEdit({...moneyEdit, date:e.target.value})} />
              <div style={S.sheetBtns}>
                <button style={S.btnGhost} onClick={()=>setMoneyEdit(null)}>閉じる</button>
                <button style={{...S.btnMain, ...(parseAmount(moneyEdit.amount)?{}:{opacity:0.5})}} onClick={saveMoneyEdit} disabled={!parseAmount(moneyEdit.amount)}>直す ✓</button>
              </div>
              <div style={S.moneyDel} onClick={()=>{ if (window.confirm("この支出を消しますか？")) { removeItem(moneyEdit.id); setMoneyEdit(null); } }}>🗑 この支出を消す</div>
            </div>
          </div>
        )}

        {/* タブを作る・名前を変える。保存するまで箱は変わらない。消したタブのカードは「情報」へ移す（消さない） */}
        {tabEdit && (
          <div style={S.sheetWrap} onClick={()=>setTabEdit(null)}>
            <div style={S.sheet} onClick={e=>e.stopPropagation()}>
              <div style={S.sheetGrip}/>
              <div style={S.sheetTitle}>タブを作る・名前を変える</div>
              <div style={S.sheetSub}>名前はタップして直せます。自分で作ったタブには、名前に合う物をAIが入れます（箱に入れる前の画面で選び直せます）。</div>
              <div style={S.fieldLabel}>自分のタブ</div>
              {tabEdit.custom.length === 0 && <div style={S.tabEditEmpty}>まだありません。下で作れます（例：推し活・子ども・仕事・旅行）。</div>}
              {tabEdit.custom.map((t, i) => (
                <div key={t.key}>
                  <div style={S.tabEditRow}>
                    <span style={{...S.tabDot, width:10, height:10, background:CUSTOM_PAL[t.pal % CUSTOM_PAL.length].dot}}/>
                    <input style={S.tabEditInput} value={t.label} maxLength={12} aria-label="タブの名前"
                      onChange={e=>setTabEdit({...tabEdit, custom: tabEdit.custom.map((x, j) => j === i ? {...x, label:e.target.value} : x)})} />
                    <span style={S.tabEditDel} onClick={()=>setTabEdit({...tabEdit, delKey: tabEdit.delKey === t.key ? null : t.key})}>🗑</span>
                  </div>
                  {tabEdit.delKey === t.key && (() => {
                    const n = (items || []).filter(it => it.category === t.key).length;
                    return (
                      <div style={S.tabEditConfirm}>
                        <span>「{t.label || "このタブ"}」を消しますか？{n ? `中のカード${n}枚は「${CATS.joho.label}」に移ります（カードは消えません）。` : ""}</span>
                        <span style={S.tabEditConfirmBtn} onClick={()=>setTabEdit({...tabEdit, custom: tabEdit.custom.filter(x => x.key !== t.key), delKey:null})}>消す</span>
                      </div>
                    );
                  })()}
                </div>
              ))}
              <div style={S.tabEditRow}>
                <span style={{...S.tabDot, width:10, height:10, background:"#d0d0da"}}/>
                <input style={S.tabEditInput} value={tabEdit.newName} maxLength={12} placeholder="新しいタブの名前"
                  onChange={e=>setTabEdit({...tabEdit, newName:e.target.value})} onKeyDown={e=>{ if (e.key === "Enter") addCustomTab(); }} />
                <span style={{...S.tabEditAddBtn, ...(tabEdit.newName.trim()?{}:{opacity:0.4})}} onClick={addCustomTab}>＋ 作る</span>
              </div>
              <div style={S.fieldLabel}>はじめからあるタブの名前</div>
              {BASE_CAT_KEYS.map(k => (
                <div key={k} style={S.tabEditRow}>
                  <span style={{...S.tabDot, width:10, height:10, background:CATS[k].dot}}/>
                  <input style={S.tabEditInput} value={tabEdit.labels[k]} maxLength={12} aria-label="タブの名前"
                    onChange={e=>setTabEdit({...tabEdit, labels:{...tabEdit.labels, [k]: e.target.value}})} />
                  {tabEdit.labels[k].trim() !== BASE_LABELS[k] && (
                    <span style={S.tabEditReset} onClick={()=>setTabEdit({...tabEdit, labels:{...tabEdit.labels, [k]: BASE_LABELS[k]}})}>元に戻す</span>
                  )}
                </div>
              ))}
              <div style={S.sheetBtns}>
                <button style={S.btnGhost} onClick={()=>setTabEdit(null)}>やめる</button>
                <button style={S.btnMain} onClick={saveTabEdit}>保存する</button>
              </div>
            </div>
          </div>
        )}

        {/* 設定シート */}
        {settings && (
          <div style={S.sheetWrap} onClick={()=>setSettings(false)}>
            <div style={S.sheet} onClick={e=>e.stopPropagation()}>
              <div style={S.sheetGrip}/>
              <div style={S.sheetTitle}>設定</div>
              <div style={S.sheetSub}>Anthropic（Claude）のAPIキーを貼り付けてください。キーはこの端末の中だけに保存されます。</div>
              <div style={S.fieldLabel}>APIキー（sk-ant-… で始まる文字列）</div>
              <textarea
                style={{...S.textarea, minHeight:64, fontFamily:"monospace", fontSize:12}}
                placeholder="sk-ant-..."
                value={keyDraft}
                onChange={e=>setKeyDraft(e.target.value)}
              />
              <div style={S.fieldLabel}>使うモデル</div>
              <select style={S.select} value={model} onChange={e=>setModel(e.target.value)}>
                <option value="claude-haiku-4-5-20251001">Haiku（速い・激安・おすすめ）</option>
                <option value="claude-sonnet-5">Sonnet 5（賢い・少し高い）</option>
                <option value="claude-sonnet-4-6">Sonnet 4.6（旧）</option>
              </select>
              <div style={S.help}>
                キーの取り方： <b>console.anthropic.com</b> に登録 → Billingで$5チャージ → API keys → Create Key
              </div>
              <div style={S.fieldLabel}>YouTubeのキー（任意）＝レシピ動画の材料を概要欄から読む</div>
              <textarea
                style={{...S.textarea, minHeight:48, fontFamily:"monospace", fontSize:12}}
                placeholder="AIza...（無くても使えます）"
                value={ytKeyDraft}
                onChange={e=>setYtKeyDraft(e.target.value)}
              />
              <div style={S.help}>
                入れると、YouTubeのレシピ動画を放り込んだ時に<b>概要欄に書いてある材料をそのまま</b>読みます（推定より正確）。無料（1日10,000回まで・動画1本＝1回）。キーはこの端末の中だけに保存されます。<br/>
                取り方： <b>console.cloud.google.com</b>（Googleアカウント）→ プロジェクトを作る → 「APIとサービス」→「ライブラリ」で <b>YouTube Data API v3</b> を有効にする → 「認証情報」→「認証情報を作成」→「APIキー」→ できたキーの「キーを制限」で、使えるサイトを <b>claudehikuroudo-pixel.github.io</b>、使えるAPIを YouTube Data API v3 だけにする
              </div>

              {/* 箱のバックアップ（書き出し・読み込み）。結果・失敗は必ずこの欄に出す */}
              <div style={S.fieldLabel}>箱のバックアップ（書き出し・読み込み）</div>
              <div style={S.bkBox}>
                <div style={S.bkNote}>
                  箱の中身はこの端末の中だけにあります。機種変更やアイコンを消す前に<b>書き出して</b>、「ファイルに保存」などで残してください。写真・材料・予定の添付も入ります（APIキーは入りません）。
                </div>
                <div style={S.bkLast}>{lastBackup ? `前回の書き出し：${fmtBkDate(lastBackup)}` : "まだ書き出したことがありません"}</div>
                {!bkOut ? (
                  <button style={{...S.bkBtn, ...(bkBusy ? {opacity:0.5} : {})}} onClick={prepareExport} disabled={!!bkBusy || !items}>
                    {bkBusy === "export" ? "ファイルを作っています…" : `⤓ 書き出す（全${(items || []).length}枚）`}
                  </button>
                ) : (
                  <div style={S.bkReady}>
                    <div style={S.bkReadyText}>
                      準備できました：カード{bkOut.count}枚（写真つき{bkOut.photos}枚）{bkOut.files ? `・添付ファイル${bkOut.files}個` : ""}・{fmtMB(bkOut.file.size)}
                      {bkOut.missing > 0 && <div style={{color:"#c0392b", marginTop:4}}>⚠ 添付ファイル{bkOut.missing}個はこの端末に見つからず、入っていません。</div>}
                    </div>
                    <div style={{display:"flex", gap:8}}>
                      <button style={{...S.bkBtn, flex:1, background:"#fff", color:"#666"}} onClick={()=>setBkOut(null)}>やめる</button>
                      <button style={{...S.bkBtn, flex:2, background:"linear-gradient(120deg,#16161e,#34344a)", color:"#fff"}} onClick={shareExport}>保存・共有する</button>
                    </div>
                  </div>
                )}
                <button style={{...S.bkBtn, marginTop:8, ...(bkBusy ? {opacity:0.5} : {})}} onClick={()=>bkFileRef.current && bkFileRef.current.click()} disabled={!!bkBusy}>
                  {bkBusy === "import" ? "ファイルを確かめています…" : "⤒ 書き出したファイルを読み込む"}
                </button>
                <input ref={bkFileRef} type="file" style={{display:"none"}} onChange={pickBackup} />
                {bkIn && (
                  <div style={S.bkReady}>
                    <div style={S.bkReadyText}>
                      {bkIn.name}（{fmtMB(bkIn.size)}）<br/>
                      {bkIn.exportedAt && fmtBkDate(bkIn.exportedAt) ? `${fmtBkDate(bkIn.exportedAt)} に書き出し・` : ""}カード{bkIn.items.length}枚{Object.keys(bkIn.files).length ? `・添付ファイル${Object.keys(bkIn.files).length}個` : ""}
                      {(bkIn.broken > 0 || bkIn.lostFiles > 0) && (
                        <div style={{color:"#c0392b", marginTop:4}}>
                          ⚠ {bkIn.broken > 0 ? `壊れていた（または重複していた）カード${bkIn.broken}枚は入りません。` : ""}{bkIn.lostFiles > 0 ? `添付ファイル${bkIn.lostFiles}個は読めません。` : ""}
                        </div>
                      )}
                    </div>
                    {!bkConfirm ? (
                      <>
                        <button style={{...S.bkBtn, background:"linear-gradient(120deg,#16161e,#34344a)", color:"#fff"}} onClick={()=>applyImport("add")} disabled={!!bkBusy}>
                          {bkBusy === "apply" ? "読み込み中…" : "今の箱に足す（同じカードは飛ばす）"}
                        </button>
                        <div style={{display:"flex", gap:8, marginTop:8}}>
                          <button style={{...S.bkBtn, flex:1, background:"#fff", color:"#666"}} onClick={()=>setBkIn(null)} disabled={!!bkBusy}>やめる</button>
                          <button style={{...S.bkBtn, flex:2, color:"#c0392b"}} onClick={()=>setBkConfirm(true)} disabled={!!bkBusy}>上書き（置き換える）</button>
                        </div>
                      </>
                    ) : (
                      <>
                        <div style={{fontSize:12, color:"#c0392b", fontWeight:700, lineHeight:1.6, margin:"2px 0 8px"}}>
                          今の箱の{(items || []).length}枚は消えて、このファイルの{bkIn.items.length}枚に置き換わります。元に戻せません。
                        </div>
                        <div style={{display:"flex", gap:8}}>
                          <button style={{...S.bkBtn, flex:1, background:"#fff", color:"#666"}} onClick={()=>setBkConfirm(false)} disabled={!!bkBusy}>戻る</button>
                          <button style={{...S.bkBtn, flex:2, background:"#c0392b", color:"#fff"}} onClick={()=>applyImport("replace")} disabled={!!bkBusy}>
                            {bkBusy === "apply" ? "読み込み中…" : "置き換える"}
                          </button>
                        </div>
                      </>
                    )}
                  </div>
                )}
                {bkMsg && <div style={bkMsg.t === "ok" ? S.bkOk : bkMsg.t === "warn" ? S.bkWarn : S.bkErr}>{bkMsg.s}</div>}
              </div>
              <div style={S.sheetBtns}>
                <button style={S.btnGhost} onClick={()=>setSettings(false)}>閉じる</button>
                <button style={S.btnMain} onClick={saveSettings}>保存する</button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}
